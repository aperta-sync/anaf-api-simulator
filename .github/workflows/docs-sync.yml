name: ANAF Documentation Sync

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual triggering from the Actions tab

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Needed to create an issue

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Required by the scraper to turn tracked PDFs into diffable text extracts.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run Scraper
        env:
          ANAF_NOTIFIER_WEBHOOK: ${{ secrets.ANAF_NOTIFIER_WEBHOOK }}
          B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          B2_REGION: ${{ vars.B2_REGION }}
        run: node scripts/anaf-scraper.mjs

      - name: Check for Spec Changes
        id: git-check
        env:
          # Swagger covers the e-Factura REST surface. The OAuth document is tracked
          # separately because the OAuth endpoints live on logincert.anaf.ro and are
          # documented on static.anaf.ro, so nothing links them from the e-Factura index.
          # Watch the .txt extract, not the .pdf — PDFs are gitignored and would never
          # show up in git status, and a binary diff would be unreadable anyway.
          WATCH_PATHS: >-
            docs/anaf/scraped/technical/swagger/
            docs/anaf/scraped/technical/Oauth_procedura_inregistrare_aplicatii_portal_ANAF.txt
        run: |
          git status --porcelain -- $WATCH_PATHS
          if [ -n "$(git status --porcelain -- $WATCH_PATHS)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT

            # Create a summary of changed files for the issue body
            git status --porcelain -- $WATCH_PATHS > changes.txt
            echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV
            cat changes.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV

            # Capture the actual diff to show what exactly changed
            git diff -- $WATCH_PATHS > diff.txt
            echo "SPEC_DIFF<<EOF" >> $GITHUB_ENV
            cat diff.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue on Change
        if: steps.git-check.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 ANAF API Update Detected" \
            --body "The automated scraper detected changes to the official ANAF specifications (OpenAPI and/or the OAuth registration procedure).

            **If \`Oauth_procedura_inregistrare_aplicatii_portal_ANAF.txt\` changed**, re-check the token lifetimes in section *Perioada de valabilitate a parametrilor utilizati* against \`src/simulation/application/services/oauth-token.service.ts\` (\`DEFAULT_ACCESS_TOKEN_TTL_SECONDS\`, \`DEFAULT_REFRESH_TOKEN_TTL_SECONDS\`).

            
            **Changed Files:**
            \`\`\`
            ${{ env.CHANGED_FILES }}
            \`\`\`
            
            <details>
            <summary><b>View Spec Differences</b> (Click to expand)</summary>

            \`\`\`diff
            ${{ env.SPEC_DIFF }}
            \`\`\`
            </details>
            
            Please run \`node scripts/anaf-scraper.mjs\` locally with your B2 credentials to fetch the latest specs and update the mock server implementation accordingly." \
            --assignee "${{ github.actor }}"
